spring.application.name=order-processing

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb?TimeZone=UTC
spring.datasource.username=orderuser
spring.datasource.password=orderpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT — replace secret with a Base64-encoded 256-bit key before deploying
jwt.secret=b3JkZXJwcm9jZXNzaW5nc2VjcmV0a2V5Zm9yand0YXV0aA==
jwt.expiration=86400000
